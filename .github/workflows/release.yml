name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_VERSION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog_version: ${{ steps.version.outputs.changelog_version }}
      dispatch_sha: ${{ steps.dispatch.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Resolve release version
        id: version
        shell: bash
        env:
          RELEASE_VERSION_RAW: ${{ env.RELEASE_VERSION_INPUT }}
        run: |
          version="${RELEASE_VERSION_RAW}"
          if [[ ! "$version" =~ ^v.+$ ]]; then
            echo "Invalid release version: $version (expected v-prefix SemVer)" >&2
            exit 1
          fi
          changelog_version="${version#v}"
          bash scripts/prepare-release.sh "$changelog_version" --semver-only
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changelog_version=$changelog_version" >> "$GITHUB_OUTPUT"

      - name: Record dispatch SHA
        id: dispatch
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify dispatch runs from current main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release dispatch must run from main (got $GITHUB_REF)" >&2
            exit 1
          fi
          git fetch origin main
          origin_main="$(git rev-parse origin/main)"
          if [ "$DISPATCH_SHA" != "$origin_main" ]; then
            echo "Dispatch SHA $DISPATCH_SHA is not current origin/main ($origin_main)" >&2
            exit 1
          fi

      - name: Prepare release script syntax
        run: bash -n scripts/prepare-release.sh scripts/prepare-release-test.sh

      - name: Prepare release tests
        run: bash scripts/prepare-release-test.sh

      - name: Check changelog readiness
        shell: bash
        env:
          CHANGELOG_VERSION: ${{ steps.version.outputs.changelog_version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bash scripts/prepare-release.sh "$CHANGELOG_VERSION" --check-only
          else
            bash scripts/prepare-release.sh "$CHANGELOG_VERSION" --require-final
          fi

      - name: Full release dry-run
        run: ./scripts/release-check.sh

      - name: Vulnerability scan
        env:
          GOTOOLCHAIN: go1.26.6
        run: ./scripts/release-check.sh vuln

  publish:
    name: Publish GitHub Release
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize changelog on main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          CHANGELOG_VERSION: ${{ needs.validate.outputs.changelog_version }}
          DISPATCH_SHA: ${{ needs.validate.outputs.dispatch_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          origin_main="$(git rev-parse origin/main)"
          if [ "$DISPATCH_SHA" != "$origin_main" ]; then
            echo "origin/main ($origin_main) moved since dispatch ($DISPATCH_SHA)" >&2
            exit 1
          fi

          git checkout main
          git pull --ff-only origin main

          bash scripts/prepare-release.sh "$CHANGELOG_VERSION"

          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "chore(release): prepare CHANGELOG for ${RELEASE_VERSION}"
            git push origin main
          fi

      - name: Resolve release commit SHA
        id: release_sha
        shell: bash
        env:
          DISPATCH_SHA: ${{ needs.validate.outputs.dispatch_sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_sha="$(git rev-parse HEAD)"
            if [ "$release_sha" = "$DISPATCH_SHA" ]; then
              echo "release commit equals validated dispatch SHA"
            elif [ "$(git rev-list --count "${DISPATCH_SHA}..HEAD")" -eq 1 ]; then
              parent_sha="$(git rev-parse HEAD^)"
              if [ "$parent_sha" != "$DISPATCH_SHA" ]; then
                echo "release commit parent $parent_sha is not dispatch SHA $DISPATCH_SHA" >&2
                exit 1
              fi
              changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
              if [ "$changed_files" != "CHANGELOG.md" ]; then
                echo "release commit changes must be changelog-only (got: $changed_files)" >&2
                exit 1
              fi
              echo "release commit is single changelog-only child of dispatch SHA"
            else
              echo "release commit must be dispatch SHA or its single changelog-only child" >&2
              exit 1
            fi
            echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify finalized changelog before publish
        shell: bash
        env:
          CHANGELOG_VERSION: ${{ needs.validate.outputs.changelog_version }}
        run: |
          bash scripts/prepare-release.sh "$CHANGELOG_VERSION" --require-final

      - name: Verify tag does not point elsewhere
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ steps.release_sha.outputs.sha }}
        run: |
          git fetch origin --tags --force

          verify_tag_ref() {
            local ref="$1"
            local label="$2"
            if ! git rev-parse --verify "$ref" >/dev/null 2>&1; then
              return 0
            fi
            local existing_sha
            existing_sha="$(git rev-parse "${ref}^{commit}")"
            if [ "$existing_sha" != "$RELEASE_SHA" ]; then
              echo "$label tag $RELEASE_VERSION commit is $existing_sha, expected $RELEASE_SHA" >&2
              exit 1
            fi
            echo "$label tag $RELEASE_VERSION already points to release commit"
          }

          verify_tag_ref "refs/tags/${RELEASE_VERSION}" "local"
          git fetch origin "refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}" --force 2>/dev/null || true
          if git rev-parse --verify "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            remote_commit_sha="$(git rev-parse "refs/tags/${RELEASE_VERSION}^{commit}")"
            if [ "$remote_commit_sha" != "$RELEASE_SHA" ]; then
              echo "remote tag $RELEASE_VERSION commit is $remote_commit_sha, expected $RELEASE_SHA" >&2
              exit 1
            fi
            echo "remote tag $RELEASE_VERSION already points to release commit"
          fi

      - name: Extract release notes
        shell: bash
        env:
          CHANGELOG_VERSION: ${{ needs.validate.outputs.changelog_version }}
        run: |
          prefix="## [${CHANGELOG_VERSION}] - "
          awk -v prefix="$prefix" '
            index($0, prefix) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "llm-guard ${{ needs.validate.outputs.version }}" > release-notes.md
            echo "" >> release-notes.md
            echo "See CHANGELOG.md for details." >> release-notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          target_commitish: ${{ steps.release_sha.outputs.sha }}
          name: llm-guard ${{ needs.validate.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
