name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test and vet (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.2', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  race:
    name: race (Go 1.26.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Race
        run: go test -race ./...

  consumer:
    name: external consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Shell syntax
        run: sh -n scripts/release-check.sh

      - name: External consumer
        run: ./scripts/release-check.sh consumer

  evaluation:
    name: evaluation regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Evaluation regression
        run: |
          go run ./cmd/llmguard-eval \
            -corpus ./testdata/evaluation/cases.jsonl \
            -format json \
            -fail-on-regression

  evaluation-smoke:
    name: generated evaluation smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Generated contract smoke
        run: |
          go run ./cmd/llmguard-eval \
            -suite ./testdata/evaluation/generated/smoke.jsonl \
            -profile contract \
            -format json \
            -fail-on-regression

      - name: Generated lifecycle smoke
        run: |
          go run ./cmd/llmguard-eval \
            -suite ./testdata/evaluation/generated/smoke.jsonl \
            -profile lifecycle \
            -format json \
            -fail-on-regression

  fuzz:
    name: bounded fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Fuzz smoke
        run: ./scripts/release-check.sh fuzz

  license:
    name: license inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: License consistency
        run: ./scripts/release-check.sh license
