name: Release check (dry-run)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-check:
    name: release dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Shell syntax
        run: sh -n scripts/release-check.sh

      - name: Full release dry-run
        run: ./scripts/release-check.sh
